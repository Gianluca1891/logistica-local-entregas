services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: logistica
      POSTGRES_PASSWORD: logistica
      POSTGRES_DB: logistica
    ports:
      - "5432:5432"
    volumes:
      - datos-db:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  datos-db:
