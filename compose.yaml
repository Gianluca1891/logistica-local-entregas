services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: logistica
      POSTGRES_PASSWORD: logistica
      POSTGRES_DB: logistica
    ports:
      - "5432:5432"
    volumes:
      - datos-db:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "logistica", "-d", "logistica"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - datos-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    init: true
    environment:
      DATABASE_URL: postgres://logistica:logistica@db:5432/logistica
      REDIS_HOST: redis
      JWT_SECRETO: secreto-de-la-demo
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/salud"]
      interval: 10s
      timeout: 5s
      retries: 5

  servicio-rutas:
    build: .
    init: true
    command: ["node", "src/servicio-rutas/index.js"]
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  datos-db:
  datos-redis:



